name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: t4-1-1
      id: t4-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t4-1-1
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          5
          3
        expected-output: |-
          スタンプは合計 8 個です
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: t4-1-2
      id: t4-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t4-1-2
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          10
          25
        expected-output: |-
          スタンプは合計 35 個です
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: t4-1-3
      id: t4-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t4-1-3
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          0
          7
        expected-output: |-
          スタンプは合計 7 個です
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: t4-1-4
      id: t4-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t4-1-4
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          100
          200
        expected-output: |-
          スタンプは合計 300 個です
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        T4-1-1_RESULTS: "${{steps.t4-1-1.outputs.result}}"
        T4-1-2_RESULTS: "${{steps.t4-1-2.outputs.result}}"
        T4-1-3_RESULTS: "${{steps.t4-1-3.outputs.result}}"
        T4-1-4_RESULTS: "${{steps.t4-1-4.outputs.result}}"
      with:
        runners: t4-1-1,t4-1-2,t4-1-3,t4-1-4