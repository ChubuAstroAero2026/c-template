name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Testexam1-1-1
      id: testexam1-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: ''
        expected-output: |-
          Hello Chutora
        comparison-method: exact
        timeout: 1
        max-score: 50
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TESTEXAM1-1-1_RESULTS: "${{steps.testexam1-1-1.outputs.result}}"
      with:
        runners: testexam1-1-1