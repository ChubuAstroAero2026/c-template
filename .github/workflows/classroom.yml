name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test6-1-1
      id: test6-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test6-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          5
          1
          2
          3
          4
          5
        expected-output: '5'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test6-1-2
      id: test6-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test6-1-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          3
          -3
          0
          -5
        expected-output: '0'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test6-1-3
      id: test6-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test6-1-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          10
          1
          3
          4
          6
          8
          2
          10
          4
          6
          8
        expected-output: '10'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test6-1-4
      id: test6-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test6-1-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          10
          1
          3
          4
          6
          8
          2
          -7
          4
          6
          8
        expected-output: '8'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST6-1-1_RESULTS: "${{steps.test6-1-1.outputs.result}}"
        TEST6-1-2_RESULTS: "${{steps.test6-1-2.outputs.result}}"
        TEST6-1-3_RESULTS: "${{steps.test6-1-3.outputs.result}}"
        TEST6-1-4_RESULTS: "${{steps.test6-1-4.outputs.result}}"
      with:
        runners: test6-1-1,test6-1-2,test6-1-3,test6-1-4