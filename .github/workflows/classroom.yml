name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test9-2-1
      id: test9-2-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test9-2-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '35'
        expected-output: '36'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test9-2-2
      id: test9-2-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test9-2-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '59'
        expected-output: '0'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test9-2-3
      id: test9-2-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test9-2-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '0'
        expected-output: '1'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test9-2-4
      id: test9-2-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test9-2-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '58'
        expected-output: '59'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST9-2-1_RESULTS: "${{steps.test9-2-1.outputs.result}}"
        TEST9-2-2_RESULTS: "${{steps.test9-2-2.outputs.result}}"
        TEST9-2-3_RESULTS: "${{steps.test9-2-3.outputs.result}}"
        TEST9-2-4_RESULTS: "${{steps.test9-2-4.outputs.result}}"
      with:
        runners: test9-2-1,test9-2-2,test9-2-3,test9-2-4