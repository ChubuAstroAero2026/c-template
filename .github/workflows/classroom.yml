name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test5-1-1
      id: test5-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '5032'
        expected-output: |-
          2
          2
          2
          17
          37
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test5-1-2
      id: test5-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-1-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '123456'
        expected-output: |-
          2
          2
          2
          2
          2
          2
          3
          643
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test5-1-3
      id: test5-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-1-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '13'
        expected-output: |-
          13
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test5-1-4
      id: test5-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-1-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '72'
        expected-output: |-
          2
          2
          2
          3
          3
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST5-1-1_RESULTS: "${{steps.test5-1-1.outputs.result}}"
        TEST5-1-2_RESULTS: "${{steps.test5-1-2.outputs.result}}"
        TEST5-1-3_RESULTS: "${{steps.test5-1-3.outputs.result}}"
        TEST5-1-4_RESULTS: "${{steps.test5-1-4.outputs.result}}"
      with:
        runners: test5-1-1,test5-1-2,test5-1-3,test5-1-4