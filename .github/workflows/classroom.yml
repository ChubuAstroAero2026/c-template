name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test8-2-1
      id: test8-2-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test8-2-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: "-5"
        expected-output: "-5の絶対値は5です"
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test8-2-2
      id: test8-2-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test8-2-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '12'
        expected-output: 12の絶対値は12です
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test8-2-3
      id: test8-2-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test8-2-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '0'
        expected-output: 0の絶対値は0です
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test8-2-4
      id: test8-2-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test8-2-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: "-999"
        expected-output: "-999の絶対値は999です"
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST8-2-1_RESULTS: "${{steps.test8-2-1.outputs.result}}"
        TEST8-2-2_RESULTS: "${{steps.test8-2-2.outputs.result}}"
        TEST8-2-3_RESULTS: "${{steps.test8-2-3.outputs.result}}"
        TEST8-2-4_RESULTS: "${{steps.test8-2-4.outputs.result}}"
      with:
        runners: test8-2-1,test8-2-2,test8-2-3,test8-2-4