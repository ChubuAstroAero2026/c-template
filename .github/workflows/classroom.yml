name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test10-1-1
      id: test10-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          5
          23800
          19800
          24800
          19600
          21955
        expected-output: |-
          4番目のサイトの19600円が最安値です。
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test10-1-2
      id: test10-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-1-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          3
          198
          256
          100
        expected-output: |-
          3番目のサイトの100円が最安値です。
        comparison-method: exact
        timeout: 1
        max-score: 18
    - name: Test10-1-3
      id: test10-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-1-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          1
          1000000
        expected-output: |-
          1番目のサイトの1000000円が最安値です。
        comparison-method: exact
        timeout: 1
        max-score: 17
    - name: Test10-1-4
      id: test10-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-1-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          1
          100
        expected-output: |-
          1番目のサイトの100円が最安値です。
        comparison-method: exact
        timeout: 1
        max-score: 15
    - name: Test10-1-5
      id: test10-1-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-1-5
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          10
          10000
          1000000
          100
          13
          42
          6534
          54
          78
          12
          0
        expected-output: |-
          10番目のサイトの0円が最安値です。
        comparison-method: exact
        timeout: 1
        max-score: 15
    - name: Test10-1-6
      id: test10-1-6
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-1-6
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          10
          10000
          1000000
          100
          13
          42
          6534
          54
          78
          12
          100000
        expected-output: |-
          9番目のサイトの12円が最安値です。
        comparison-method: exact
        timeout: 1
        max-score: 15
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST10-1-1_RESULTS: "${{steps.test10-1-1.outputs.result}}"
        TEST10-1-2_RESULTS: "${{steps.test10-1-2.outputs.result}}"
        TEST10-1-3_RESULTS: "${{steps.test10-1-3.outputs.result}}"
        TEST10-1-4_RESULTS: "${{steps.test10-1-4.outputs.result}}"
        TEST10-1-5_RESULTS: "${{steps.test10-1-5.outputs.result}}"
        TEST10-1-6_RESULTS: "${{steps.test10-1-6.outputs.result}}"
      with:
        runners: test10-1-1,test10-1-2,test10-1-3,test10-1-4,test10-1-5,test10-1-6