name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test6-3-1
      id: test6-3-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test6-3-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          ChubuUniversity
          u
        expected-output: '2'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test6-3-2
      id: test6-3-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test6-3-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          AstronauticsandAeronautics
          a
        expected-output: '6'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test6-3-3
      id: test6-3-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test6-3-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          Paiza
          z
        expected-output: '3'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test6-3-4
      id: test6-3-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test6-3-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          MacBook
          a
        expected-output: '1'
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST6-3-1_RESULTS: "${{steps.test6-3-1.outputs.result}}"
        TEST6-3-2_RESULTS: "${{steps.test6-3-2.outputs.result}}"
        TEST6-3-3_RESULTS: "${{steps.test6-3-3.outputs.result}}"
        TEST6-3-4_RESULTS: "${{steps.test6-3-4.outputs.result}}"
      with:
        runners: test6-3-1,test6-3-2,test6-3-3,test6-3-4