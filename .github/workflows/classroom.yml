name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test9-3-1
      id: test9-3-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test9-3-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '2024'
        expected-output: 2024年はうるう年です。
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test9-3-2
      id: test9-3-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test9-3-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '2100'
        expected-output: 2100年は平年です。
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test9-3-3
      id: test9-3-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test9-3-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '2000'
        expected-output: 2000年はうるう年です。
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test9-3-4
      id: test9-3-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test9-3-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '2023'
        expected-output: 2023年は平年です。
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST9-3-1_RESULTS: "${{steps.test9-3-1.outputs.result}}"
        TEST9-3-2_RESULTS: "${{steps.test9-3-2.outputs.result}}"
        TEST9-3-3_RESULTS: "${{steps.test9-3-3.outputs.result}}"
        TEST9-3-4_RESULTS: "${{steps.test9-3-4.outputs.result}}"
      with:
        runners: test9-3-1,test9-3-2,test9-3-3,test9-3-4