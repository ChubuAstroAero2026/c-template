name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test4-1-1
      id: test4-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test4-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '20 16 0.8'
        expected-output: |-
          stop
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test4-1-2
      id: test4-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test4-1-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '20 20 0.1'
        expected-output: |-
          pass
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test4-1-3
      id: test4-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test4-1-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '100 14 0.1'
        expected-output: |-
          stop
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test4-1-4
      id: test4-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test4-1-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '10 30 0.1'
        expected-output: |-
          pass
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST4-1-1_RESULTS: "${{steps.test4-1-1.outputs.result}}"
        TEST4-1-2_RESULTS: "${{steps.test4-1-2.outputs.result}}"
        TEST4-1-3_RESULTS: "${{steps.test4-1-3.outputs.result}}"
        TEST4-1-4_RESULTS: "${{steps.test4-1-4.outputs.result}}"
      with:
        runners: test4-1-1,test4-1-2,test4-1-3,test4-1-4