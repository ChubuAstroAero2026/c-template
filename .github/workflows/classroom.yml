name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Testexam1-6-1
      id: testexam1-6-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-6-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          900
          1
        expected-output: |-
          480
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Testexam1-6-2
      id: testexam1-6-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-6-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          900
          3
        expected-output: |-
          1760
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Testexam1-6-3
      id: testexam1-6-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-6-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          300
          0
        expected-output: |-
          0
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Testexam1-6-4
      id: testexam1-6-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-6-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          600
          1
        expected-output: |-
          320
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Testexam1-6-5
      id: testexam1-6-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-6-5
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          1800
          1
        expected-output: |-
          3680
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TESTEXAM1-6-1_RESULTS: "${{steps.testexam1-6-1.outputs.result}}"
        TESTEXAM1-6-2_RESULTS: "${{steps.testexam1-6-2.outputs.result}}"
        TESTEXAM1-6-3_RESULTS: "${{steps.testexam1-6-3.outputs.result}}"
        TESTEXAM1-6-4_RESULTS: "${{steps.testexam1-6-4.outputs.result}}"
        TESTEXAM1-6-5_RESULTS: "${{steps.testexam1-6-5.outputs.result}}"
      with:
        runners: testexam1-6-1,testexam1-6-2,testexam1-6-3,testexam1-6-4,testexam1-6-5