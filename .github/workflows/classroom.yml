name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test11-1-1
      id: test11-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test11-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          5
          2
          8
        expected-output: |-
          2
          5
          8
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test11-1-2
      id: test11-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test11-1-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          10
          20
          30
        expected-output: |-
          10
          20
          30
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test11-1-3
      id: test11-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test11-1-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          99
          50
          12
        expected-output: |-
          12
          50
          99
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test11-1-4
      id: test11-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test11-1-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          7
          3
          7
        expected-output: |-
          3
          7
          7
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST11-1-1_RESULTS: "${{steps.test11-1-1.outputs.result}}"
        TEST11-1-2_RESULTS: "${{steps.test11-1-2.outputs.result}}"
        TEST11-1-3_RESULTS: "${{steps.test11-1-3.outputs.result}}"
        TEST11-1-4_RESULTS: "${{steps.test11-1-4.outputs.result}}"
      with:
        runners: test11-1-1,test11-1-2,test11-1-3,test11-1-4