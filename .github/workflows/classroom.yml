name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: t7-1-1
      id: t7-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t7-1-1
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          3
          101 75
          102 90
          103 60
        expected-output: |-
          ID:102 (90点)
          ID:101 (75点)
          ID:103 (60点)
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: t7-1-2
      id: t7-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t7-1-2
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          4
          1 100
          2 80
          3 80
          4 50
        expected-output: |-
          ID:1 (100点)
          ID:2 (80点)
          ID:3 (80点)
          ID:4 (50点)
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: t7-1-3
      id: t7-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t7-1-3
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          1
          999 100
        expected-output: |-
          ID:999 (100点)
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: t7-1-4
      id: t7-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t7-1-4
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          5
          10 40
          20 100
          30 10
          40 85
          50 65
        expected-output: |-
          ID:20 (100点)
          ID:40 (85点)
          ID:50 (65点)
          ID:10 (40点)
          ID:30 (10点)
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        T7-1-1_RESULTS: "${{steps.t7-1-1.outputs.result}}"
        T7-1-2_RESULTS: "${{steps.t7-1-2.outputs.result}}"
        T7-1-3_RESULTS: "${{steps.t7-1-3.outputs.result}}"
        T7-1-4_RESULTS: "${{steps.t7-1-4.outputs.result}}"
      with:
        runners: t7-1-1,t7-1-2,t7-1-3,t7-1-4