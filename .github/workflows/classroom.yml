name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Testexam1-3-1
      id: testexam1-3-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-3-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          2
          3
        expected-output: |-
          15
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Testexam1-3-2
      id: testexam1-3-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-3-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          -5
          -2
        expected-output: |-
          -21
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Testexam1-3-3
      id: testexam1-3-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-3-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          10
          -4
        expected-output: |-
          18
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Testexam1-3-4
      id: testexam1-3-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-3-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          5
          -5
        expected-output: |-
          0
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TESTEXAM1-3-1_RESULTS: "${{steps.testexam1-3-1.outputs.result}}"
        TESTEXAM1-3-2_RESULTS: "${{steps.testexam1-3-2.outputs.result}}"
        TESTEXAM1-3-3_RESULTS: "${{steps.testexam1-3-3.outputs.result}}"
        TESTEXAM1-3-4_RESULTS: "${{steps.testexam1-3-4.outputs.result}}"
      with:
        runners: testexam1-3-1,testexam1-3-2,testexam1-3-3,testexam1-3-4