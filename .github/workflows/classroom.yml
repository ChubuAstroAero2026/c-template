name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test3-1-1
      id: test3-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          2
          3
        expected-output: |-
          25
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test3-1-2
      id: test3-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          0
          5
        expected-output: |-
          25
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test3-1-3
      id: test3-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          10
          20
        expected-output: |-
          900
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test3-1-4
      id: test3-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          1
          1
        expected-output: |-
          4
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test3-1-5
      id: test3-1-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-5
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          100
          0
        expected-output: |-
          10000
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST3_1_1_RESULTS: "${{steps.test3-1-1.outputs.result}}"
        TEST3_1_2_RESULTS: "${{steps.test3-1-2.outputs.result}}"
        TEST3_1_3_RESULTS: "${{steps.test3-1-3.outputs.result}}"
        TEST3_1_4_RESULTS: "${{steps.test3-1-4.outputs.result}}"
        TEST3_1_5_RESULTS: "${{steps.test3-1-5.outputs.result}}"
      with:
        runners: test3-1-1,test3-1-2,test3-1-3,test3-1-4,test3-1-5