name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test3-1-1
      id: test3-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '95'
        expected-output: |-
          テストの点数95
          判定S
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test3-1-2
      id: test3-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '59'
        expected-output: |-
          テストの点数59
          判定E
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test3-1-3
      id: test3-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '80'
        expected-output: |-
          テストの点数80
          判定A
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test3-1-4
      id: test3-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '77'
        expected-output: |-
          テストの点数77
          判定B
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test3-1-5
      id: test3-1-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test3-1-5
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: "-10"
        expected-output: |-
          テストの点数-10
          判定E
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST3_1_1_RESULTS: "${{steps.test3-1-1.outputs.result}}"
        TEST3_1_2_RESULTS: "${{steps.test3-1-2.outputs.result}}"
        TEST3_1_3_RESULTS: "${{steps.test3-1-3.outputs.result}}"
        TEST3_1_4_RESULTS: "${{steps.test3-1-4.outputs.result}}"
        TEST3_1_5_RESULTS: "${{steps.test3-1-5.outputs.result}}"
      with:
        runners: test3-1-1,test3-1-2,test3-1-3,test3-1-4,test3-1-5