name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: t5-1-1
      id: t5-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t5-1-1
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          24
          8
        expected-output: |-
          50.91
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: t5-1-2
      id: t5-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t5-1-2
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          8
          8
        expected-output: |-
          5.66
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: t5-1-3
      id: t5-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t5-1-3
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          10
          16
        expected-output: |-
          4.78
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: t5-1-4
      id: t5-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: t5-1-4
        setup-command: ''
        command: gcc main.c -o main -lm && ./main
        input: |-
          20
          4
        expected-output: |-
          50.00
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        T5-1-1_RESULTS: "${{steps.t5-1-1.outputs.result}}"
        T5-1-2_RESULTS: "${{steps.t5-1-2.outputs.result}}"
        T5-1-3_RESULTS: "${{steps.t5-1-3.outputs.result}}"
        T5-1-4_RESULTS: "${{steps.t5-1-4.outputs.result}}"
      with:
        runners: t5-1-1,t5-1-2,t5-1-3,t5-1-4