name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test10-4-1
      id: test10-4-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-4-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          1
        expected-output: |-
          305.96
        comparison-method: exact
        timeout: 1
        max-score: 17
    - name: Test10-4-2
      id: test10-4-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-4-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          10
        expected-output: |-
          3.06
        comparison-method: exact
        timeout: 1
        max-score: 17
    - name: Test10-4-3
      id: test10-4-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-4-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          3.14
        expected-output: |-
          31.03
        comparison-method: exact
        timeout: 1
        max-score: 17
    - name: Test10-4-4
      id: test10-4-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-4-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          3
        expected-output: |-
          34.00
        comparison-method: exact
        timeout: 1
        max-score: 17
    - name: Test10-4-5
      id: test10-4-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-4-5
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          5.2
        expected-output: |-
          11.32
        comparison-method: exact
        timeout: 1
        max-score: 16
    - name: Test10-4-6
      id: test10-4-6
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-4-6
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          123
        expected-output: |-
          0.02
        comparison-method: exact
        timeout: 1
        max-score: 16
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST10-4-1_RESULTS: "${{steps.test10-4-1.outputs.result}}"
        TEST10-4-2_RESULTS: "${{steps.test10-4-2.outputs.result}}"
        TEST10-4-3_RESULTS: "${{steps.test10-4-3.outputs.result}}"
        TEST10-4-4_RESULTS: "${{steps.test10-4-4.outputs.result}}"
        TEST10-4-5_RESULTS: "${{steps.test10-4-5.outputs.result}}"
        TEST10-4-6_RESULTS: "${{steps.test10-4-6.outputs.result}}"
      with:
        runners: test10-4-1,test10-4-2,test10-4-3,test10-4-4,test10-4-5,test10-4-6