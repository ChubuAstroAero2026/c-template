name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test7-2-1
      id: test7-2-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test7-2-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          1 2 3 
          4 5 6 
          8 7 
          6 5 
          4 3 
        expected-output: |-
          32	26	
          86	71	
        comparison-method: exact
        timeout: 1
        max-score: 50
    - name: Test7-2-2
      id: test7-2-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test7-2-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          -1 -2 -3 
          4 5 6 
          8 7 
          6 5 
          4 3 
        expected-output: |-
          -32	-26	
          86	71	
        comparison-method: exact
        timeout: 1
        max-score: 50
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST7-2-1_RESULTS: "${{steps.test7-2-1.outputs.result}}"
        TEST7-2-2_RESULTS: "${{steps.test7-2-2.outputs.result}}"
      with:
        runners: test7-2-1,test7-2-2