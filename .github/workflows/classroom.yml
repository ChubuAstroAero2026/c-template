name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test5-2-1
      id: test5-2-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-2-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '15'
        expected-output: |-
          1
          2
          Fizz
          4
          Buzz
          Fizz
          7
          8
          Fizz
          Buzz
          11
          Fizz
          13
          14
          FizzBuzz
        comparison-method: exact
        timeout: 1
        max-score: 35
    - name: Test5-2-2
      id: test5-2-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-2-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '30'
        expected-output: |-
          1
          2
          Fizz
          4
          Buzz
          Fizz
          7
          8
          Fizz
          Buzz
          11
          Fizz
          13
          14
          FizzBuzz
          16
          17
          Fizz
          19
          Buzz
          Fizz
          22
          23
          Fizz
          Buzz
          26
          Fizz
          28
          29
          FizzBuzz
        comparison-method: exact
        timeout: 1
        max-score: 35
    - name: Test5-2-3
      id: test5-2-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-2-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '10'
        expected-output: |-
          1
          2
          Fizz
          4
          Buzz
          Fizz
          7
          8
          Fizz
          Buzz
        comparison-method: exact
        timeout: 1
        max-score: 30
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST5-2-1_RESULTS: "${{steps.test5-2-1.outputs.result}}"
        TEST5-2-2_RESULTS: "${{steps.test5-2-2.outputs.result}}"
        TEST5-2-3_RESULTS: "${{steps.test5-2-3.outputs.result}}"
      with:
        runners: test5-2-1,test5-2-2,test5-2-3