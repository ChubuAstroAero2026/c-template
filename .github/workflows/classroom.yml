name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test7-1-1
      id: test7-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test7-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          3
          1
          2
          3
        expected-output: |-
          2.000
          0.667
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test7-1-2
      id: test7-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test7-1-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          5
          3
          0
          1
          3
          -4
        expected-output: |-
          0.600
          6.640
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test7-1-3
      id: test7-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test7-1-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          8
          1
          13
          -9
          3
          10
          5
          3
          -4
        expected-output: |-
          2.750
          43.688
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test7-1-4
      id: test7-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test7-1-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          3
          0
          0
          0
        expected-output: |-
          0.000
          0.000
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST7-1-1_RESULTS: "${{steps.test7-1-1.outputs.result}}"
        TEST7-1-2_RESULTS: "${{steps.test7-1-2.outputs.result}}"
        TEST7-1-3_RESULTS: "${{steps.test7-1-3.outputs.result}}"
        TEST7-1-4_RESULTS: "${{steps.test7-1-4.outputs.result}}"
      with:
        runners: test7-1-1,test7-1-2,test7-1-3,test7-1-4