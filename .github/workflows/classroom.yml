name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Testexam1-2-1
      id: testexam1-2-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-2-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          5
        expected-output: |-
          chutora1
          chutora2
          chutora3
          chutora5
          chutora6
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Testexam1-2-2
      id: testexam1-2-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-2-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          3
        expected-output: |-
          chutora1
          chutora2
          chutora3
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Testexam1-2-3
      id: testexam1-2-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-2-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          15
        expected-output: |-
          chutora1
          chutora2
          chutora3
          chutora5
          chutora6
          chutora7
          chutora8
          chutora10
          chutora11
          chutora12
          chutora13
          chutora15
          chutora16
          chutora17
          chutora18
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Testexam1-2-4
      id: testexam1-2-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Testexam1-2-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          1
        expected-output: |-
          chutora1
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TESTEXAM1-2-1_RESULTS: "${{steps.testexam1-2-1.outputs.result}}"
        TESTEXAM1-2-2_RESULTS: "${{steps.testexam1-2-2.outputs.result}}"
        TESTEXAM1-2-3_RESULTS: "${{steps.testexam1-2-3.outputs.result}}"
        TESTEXAM1-2-4_RESULTS: "${{steps.testexam1-2-4.outputs.result}}"
      with:
        runners: testexam1-2-1,testexam1-2-2,testexam1-2-3,testexam1-2-4
