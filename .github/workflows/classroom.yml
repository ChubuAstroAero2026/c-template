name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test12-1-1
      id: test12-1-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test12-1-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          78
          21.45
          4502
        expected-output: |-
          Pt の 比重は 21.45、価格は 4502 円です。
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test12-1-2
      id: test12-1-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test12-1-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          79
          19.32
          7148
        expected-output: |-
          Au の 比重は 19.32、価格は 7148 円です。
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test12-1-3
      id: test12-1-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test12-1-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          47
          10.49
          106
        expected-output: |-
          Ag の 比重は 10.49、価格は 106 円です。
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test12-1-4
      id: test12-1-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test12-1-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          22
          4.51
          250
        expected-output: |-
          Ti の 比重は 4.51、価格は 250 円です。
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test12-1-5
      id: test12-1-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test12-1-5
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          26
          7.85
          40
        expected-output: |-
          Fe の 比重は 7.85、価格は 40 円です。
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST12-1-1_RESULTS: "${{steps.test12-1-1.outputs.result}}"
        TEST12-1-2_RESULTS: "${{steps.test12-1-2.outputs.result}}"
        TEST12-1-3_RESULTS: "${{steps.test12-1-3.outputs.result}}"
        TEST12-1-4_RESULTS: "${{steps.test12-1-4.outputs.result}}"
        TEST12-1-5_RESULTS: "${{steps.test12-1-5.outputs.result}}"
      with:
        runners: test12-1-1,test12-1-2,test12-1-3,test12-1-4,test12-1-5