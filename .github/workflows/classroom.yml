name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test5-3-1
      id: test5-3-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-3-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '3'
        expected-output: |-
            *
           ***
          *****
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test5-3-2
      id: test5-3-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-3-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '5'
        expected-output: |-
              *
             ***
            *****
           *******
          *********
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test5-3-3
      id: test5-3-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-3-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '1'
        expected-output: |-
          *
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test5-3-4
      id: test5-3-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test5-3-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: '8'
        expected-output: |-
                 *
                ***
               *****
              *******
             *********
            ***********
           *************
          ***************
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST5-3-1_RESULTS: "${{steps.test5-3-1.outputs.result}}"
        TEST5-3-2_RESULTS: "${{steps.test5-3-2.outputs.result}}"
        TEST5-3-3_RESULTS: "${{steps.test5-3-3.outputs.result}}"
        TEST5-3-4_RESULTS: "${{steps.test5-3-4.outputs.result}}"
      with:
        runners: test5-3-1,test5-3-2,test5-3-3,test5-3-4