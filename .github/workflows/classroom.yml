name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test10-3-1
      id: test10-3-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-3-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          1
          2
        expected-output: |-
          0.50
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test10-3-2
      id: test10-3-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-3-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          4
          3
        expected-output: |-
          1.33
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test10-3-3
      id: test10-3-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-3-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          100
          25
        expected-output: |-
          4.00
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test10-3-4
      id: test10-3-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-3-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          3
          5
        expected-output: |-
          0.60
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Test10-3-5
      id: test10-3-5
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test10-3-5
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: |-
          -10
          2
        expected-output: |-
          -5.00
        comparison-method: exact
        timeout: 1
        max-score: 20
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST10-3-1_RESULTS: "${{steps.test10-3-1.outputs.result}}"
        TEST10-3-2_RESULTS: "${{steps.test10-3-2.outputs.result}}"
        TEST10-3-3_RESULTS: "${{steps.test10-3-3.outputs.result}}"
        TEST10-3-4_RESULTS: "${{steps.test10-3-4.outputs.result}}"
        TEST10-3-5_RESULTS: "${{steps.test10-3-5.outputs.result}}"
      with:
        runners: test10-3-1,test10-3-2,test10-3-3,test10-3-4,test10-3-5