name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Test8-3-1
      id: test8-3-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test8-3-1
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: TechChan2026
        expected-output: 安全なパスワードです
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test8-3-2
      id: test8-3-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test8-3-2
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: cat123
        expected-output: 危険！短すぎます
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test8-3-3
      id: test8-3-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test8-3-3
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: abcdefg
        expected-output: 危険！短すぎます
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Test8-3-4
      id: test8-3-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Test8-3-4
        setup-command: ''
        command: gcc main.c -o main && ./main
        input: password
        expected-output: 安全なパスワードです
        comparison-method: exact
        timeout: 1
        max-score: 25
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST8-3-1_RESULTS: "${{steps.test8-3-1.outputs.result}}"
        TEST8-3-2_RESULTS: "${{steps.test8-3-2.outputs.result}}"
        TEST8-3-3_RESULTS: "${{steps.test8-3-3.outputs.result}}"
        TEST8-3-4_RESULTS: "${{steps.test8-3-4.outputs.result}}"
      with:
        runners: test8-3-1,test8-3-2,test8-3-3,test8-3-4